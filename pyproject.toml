[project]
name = "walle-cli"
version = "0.1.0"
description = "Collect, compact and sort agent instruction files, and measure their cost in real sessions."
requires-python = ">=3.11"

[project.scripts]
walle = "walle.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["walle"]

[tool.setuptools.package-data]
walle = ["report.html", "fonts/*.woff2", "fonts/OFL.txt", "appui/*.html", "appui/*.js", "appui/*.css", "appui/*.md", "appui/*.svg",
         "appui/vendor/*.js", "appui/vendor/REACT-LICENSE", "appui/vendor/walle-ds/*"]
