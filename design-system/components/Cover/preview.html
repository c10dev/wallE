<!doctype html>
<html lang="en">
<head>

<title>walle</title>
<style>

<div class="cover">

<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      walle-yellow 176×216 bled off the top (WALL·E's body, largest) · walle-orange 176×48 under it · fg 304×224 bled off the right (dark ink in light, EVE-white in dark) · eve-glow pill 192×48 on it (EVE's visor) · leaf 48×24 once (the seedling) — ≈39% of 960×288
